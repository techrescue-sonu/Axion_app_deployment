# ============================================================
# Terraform Azure Infrastructure Pipeline
# ============================================================

name: Terraform Azure Infrastructure

# ============================================================
# TRIGGERS
# ============================================================
# 1. Push to main
# 2. Pull Request to main
# 3. Manual execution from GitHub Actions UI
# ============================================================

on:

  # ----------------------------------------------------------
  # Trigger 1: main branch par push
  # ----------------------------------------------------------
  push:
    branches:
      - main

  # ----------------------------------------------------------
  # Trigger 2: main branch ke against Pull Request
  # ----------------------------------------------------------
  pull_request:
    branches:
      - main

  # ----------------------------------------------------------
  # Trigger 3: Manual Run
  # ----------------------------------------------------------
  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read
  id-token: write


# ============================================================
# STAGE 1
# Terraform Init -> Validate -> Plan
# ============================================================

jobs:

  terraform-plan:

    name: Terraform Init Validate Plan

    # Windows Self-Hosted Runner
    runs-on: [self-hosted, Windows, X64]

    steps:

      # ======================================================
      # Checkout repository
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # Azure Login using OIDC
      # ======================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ======================================================
      # Check Terraform version
      # ======================================================

      - name: Terraform Version
        shell: powershell
        run: terraform --version


      # ======================================================
      # Terraform Init
      # ======================================================

      - name: Terraform Init
        shell: powershell
        run: terraform init


      # ======================================================
      # Terraform Validate
      # ======================================================

      - name: Terraform Validate
        shell: powershell
        run: terraform validate


      # ======================================================
      # Terraform Plan
      # ======================================================

      - name: Terraform Plan
        shell: powershell
        run: terraform plan -out=tfplan


      # ======================================================
      # Upload Terraform Plan
      # ======================================================

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan


  # ==========================================================
  # STAGE 2
  # Terraform Apply
  # ==========================================================

  terraform-apply:

    name: Terraform Apply

    # Apply tabhi chalega jab Plan successful ho
    needs: terraform-plan

    runs-on: [self-hosted, Windows, X64]

    steps:

      # ======================================================
      # Checkout repository
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # Azure Login
      # ======================================================

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ======================================================
      # Download Terraform Plan
      # ======================================================

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan


      # ======================================================
      # Terraform Init
      # ======================================================

      - name: Terraform Init
        shell: powershell
        run: terraform init


      # ======================================================
      # Terraform Apply
      # ======================================================

      - name: Terraform Apply
        shell: powershell
        run: terraform apply tfplan
