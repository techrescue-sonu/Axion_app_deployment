trigger:
  branches:
    include:
      - main
      - feature/*

  paths:
    include:
      - /infrastructure/terraform/enviroments/dev

pool:
  name: axion-agent
variables:
  workingdirectory: '$(System.DefaultWorkingDirectory)/infrastructure/terraform/enviroments/dev'
stages:
  - stage: TerraformInit
    dependsOn: []
    displayName: Terraform_Init
    jobs:
      - job:
        displayName: Terraform Init
        steps:
        - task: TerraformTask@5
          displayName: Terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(workingdirectory)'
            backendServiceArm: 'axion-service-connection'
            backendAzureRmResourceGroupName: 'sonu-axion-rg'
            backendAzureRmStorageAccountName: 'axionstorageaccountsonu1'
            backendAzureRmContainerName: 'axion-container'
            backendAzureRmKey: 'techrescue.terraform.tfstate'
  - stage: Validate
    displayName: Terraform_Validate
    dependsOn: []
    jobs:
      - job:
        displayName: Terraform Validate
        steps:
        - task: TerraformTask@5
          displayName: terraform validate
          inputs:
              provider: 'azurerm'
              command: 'validate'

  - stage: TerraformFmt
    dependsOn: []
    jobs:
      - job:
        displayName: Terraform FMT
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'Terraform fmt -recursive'

  - stage: tflintScan
    dependsOn: []
    displayName: TFLint
    jobs:
      - job:
        displayName: lflint scan
        steps:
        
          - task: CmdLine@2
            displayName: Download Tflint tool and install
            inputs:
              script: |
                wget https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip
                
                ls -lh tflint_linux_amd64.zip
                
                unzip tflint_linux_amd64.zip
                
                ls -l tflint
                
                sudo mv tflint /usr/local/bin/tflint

                sudo chmod +x /usr/local/bin/tflint
                
                
                tflint --version

          - task: CmdLine@2
            displayName: tflint scan
            continueOnError: true
            inputs:
              script: |
                tflint --init
                
                tflint --recursive
                
                tflint --recursive --format=json > tflint-report.json


  - stage: tfsec
    displayName: lfsec scan
    dependsOn: []
    jobs:
      - job: 
        steps:
         - task: CmdLine@2
           displayName: TFsec Install
           inputs:
             script: |
               curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
               
               tfsec --version
         - task: CmdLine@2
           displayName: tfsec Security Scan
           continueOnError: true
           inputs:
              script: 'tfsec .'

  - stage: TerraformPlan
    displayName: Terraform Plan
    dependsOn: 
      - tfsec
      - tflintScan
      - TerraformFmt
      - Validate
      - TerraformInit
    jobs: 
      - job:
        displayName: Terraform Plan
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            displayName: Terraform init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingdirectory)'
              backendServiceArm: 'axion-service-connection'
              backendAzureRmResourceGroupName: 'sonu-axion-rg'
              backendAzureRmStorageAccountName: 'axionstorageaccountsonu1'
              backendAzureRmContainerName: 'axion-container'
              backendAzureRmKey: 'techrescue.terraform.tfstate'
          

          - task: TerraformTask@5
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(workingdirectory)'
              environmentServiceNameAzureRM: 'axion-service-connection'
          
          
  - stage: ManualValidation
    dependsOn: [TerraformPlan]
    pool: server
    displayName: Mannual Approval
    jobs:
  
      - job:
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: 'lakshyaright@gmail.com'
              instructions: 'bhai bna diya dekh ke approve kar do'

  - stage:
    displayName: TerraformApply
    dependsOn: 
      - TerraformPlan
      - ManualValidation
    condition: and(succeeded(),eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job:
        displayName: Terraform Apply
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            displayName: Terraform init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingdirectory)'
              backendServiceArm: 'axion-service-connection'
              backendAzureRmResourceGroupName: 'sonu-axion-rg'
              backendAzureRmStorageAccountName: 'axionstorageaccountsonu1'
              backendAzureRmContainerName: 'axion-container'
              backendAzureRmKey: 'techrescue.terraform.tfstate'
          
          - task: TerraformTask@5
            displayName: Terraform Apply
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingdirectory)'
              environmentServiceNameAzureRM: 'axion-service-connection'
          
